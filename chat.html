<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Chat Intelligence</title>
<style>
:root{color-scheme:dark;--bg:#0d0d0f;--panel:#15151a;--line:#2a2a32;--text:#e8e8ee;--muted:#9292a2;--blue:#6c8aff;--green:#5dba7e;--amber:#f5a623;--red:#ff6b6b;--purple:#b48eff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.title{font-size:24px;font-weight:700}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;text-decoration:none}.btn.primary{background:var(--blue);color:#09090b;border-color:var(--blue);font-weight:700}.status{padding:6px 10px;border-radius:999px;background:#222;color:var(--muted);font-size:12px}.status.real{color:var(--green);background:#173023}.status.partial{color:var(--amber);background:#302410}.status.blocked{color:var(--red);background:#321919}.bar{display:flex;gap:8px;margin-bottom:16px}.input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:9px}.select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:9px}.btn.search{border:0;background:var(--blue);color:#09090b;font-weight:700;padding:0 18px;border-radius:9px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.section h2{font-size:15px;margin:0 0 12px}.results{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:10px;padding:14px}.head{display:flex;justify-content:space-between;gap:12px}.source{font-weight:700}.date,.meta{color:var(--muted);font-size:12px}.subject{font-weight:650;margin-top:5px}.snippet{margin-top:8px;white-space:pre-wrap;color:#c8c8d0;line-height:1.55}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#24242b;color:var(--muted);font-size:11px;margin:8px 6px 0 0}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}pre{white-space:pre-wrap;overflow:auto;max-height:420px;background:#0b0b0d;border:1px solid var(--line);padding:12px;border-radius:8px}.empty{color:var(--muted);padding:30px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.num{font-size:24px;font-weight:750}.label{color:var(--muted);font-size:12px;margin-top:4px}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="title">LLM Chat Intelligence</div><div class="sub">Production search across the receipted LLM conversation corpus.</div></div><div class="actions"><span id="state" class="status">CHECKING</span><a class="btn" href="/">Runtime Monitor</a></div></header>
<div class="bar"><input id="q" class="input" placeholder="Search chats, e.g. bridge, novel, ATO, Supabase…"><select id="source" class="select"><option value="">All providers</option><option>gpt</option><option>claude</option><option>gemini</option><option>grok</option><option>perplexity</option><option>system</option></select><button id="go" class="btn search">Search</button></div>
<section class="stats"><div class="stat"><div id="count" class="num">—</div><div class="label">Matched</div></div><div class="stat"><div id="code" class="num">—</div><div class="label">Code</div></div><div class="stat"><div id="bridge" class="num">—</div><div class="label">Bridge</div></div><div class="stat"><div id="receipt" class="num">—</div><div class="label">Receipt</div></div></section>
<div class="grid"><section class="section"><h2>Results</h2><div id="results" class="results"><div class="empty">Enter a search term.</div></div></section><section class="section"><h2>Evidence</h2><div id="evidence" class="empty">No query executed.</div></section></div>
</main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lit(s){return "'"+String(s).replace(/'/g,"''").replace(/\\/g,'\\\\')+"'"}
function makeSQL(q,source){let where=[];if(source)where.push(`ai_source=${lit(source)}`);if(q.trim()){const term=q.trim().replace(/[%_]/g,m=>'\\'+m);where.push(`(COALESCE(content::text,'') ILIKE '%'||${lit(term)}||'%' OR COALESCE(subject,'') ILIKE '%'||${lit(term)}||'%')`)}const w=where.length?' WHERE '+where.join(' AND '):'';return `SELECT id,created_at,session_id,ai_source,message_type,subject,content::text AS content_text,tags,status FROM gpt_conversations${w} ORDER BY created_at DESC LIMIT 100`}
function analyse(rows){return rows.reduce((a,r)=>{const t=(r.content_text||'')+' '+(r.subject||'');const l=t.toLowerCase();a.code+=l.includes('```')?1:0;a.bridge+=l.includes('bridge')?1:0;a.receipt+=l.includes('receipt')||l.includes('completed:')?1:0;return a},{code:0,bridge:0,receipt:0})}
function render(rows,q){$('results').replaceChildren();if(!rows.length){$('results').append(Object.assign(document.createElement('div'),{className:'empty',textContent:'No results.'}));$('evidence').textContent='The live query returned zero rows.';return}const a=analyse(rows);$('count').textContent=rows.length;$('code').textContent=a.code;$('bridge').textContent=a.bridge;$('receipt').textContent=a.receipt;for(const r of rows){const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='head';const left=document.createElement('div');const src=document.createElement('div');src.className='source';src.textContent=r.ai_source||'unknown';const subj=document.createElement('div');subj.className='subject';subj.textContent=r.subject||r.message_type||'Untitled';left.append(src,subj);const date=document.createElement('div');date.className='date';date.textContent=r.created_at?new Date(r.created_at).toLocaleString('en-AU'):'';head.append(left,date);const meta=document.createElement('div');meta.className='meta';meta.textContent=(r.message_type||'')+(r.session_id?' · '+r.session_id.slice(0,24):'');const snippet=document.createElement('div');snippet.className='snippet';snippet.textContent=(r.content_text||'').slice(0,700);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Evidence';const pre=document.createElement('pre');pre.textContent=r.content_text||'';details.append(summary,pre);card.append(head,meta,snippet,details);$('results').append(card)}$('evidence').innerHTML=`<div class="ok">LIVE QUERY RETURNED</div><p>${rows.length.toLocaleString('en-AU')} rows returned from <code>gpt_conversations</code>.</p><p>Query: <code>${esc(q||'all')}</code></p>`}
async function search(){const q=$('q').value;const source=$('source').value;$('go').disabled=true;$('state').textContent='QUERYING';$('state').className='status';try{const r=await fetch('/api/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql:makeSQL(q,source)})});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);const x=d.result??d;const rows=Array.isArray(x)?x:(x.result||x.rows||x.data||[]);$('state').textContent='REAL';$('state').className='status real';render(rows,q)}catch(e){$('state').textContent='BLOCKED';$('state').className='status blocked';$('results').replaceChildren(Object.assign(document.createElement('div'),{className:'empty bad',textContent:'Live query unavailable: '+e.message}));$('evidence').textContent='No demo fallback is used.'}finally{$('go').disabled=false}}
$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};
</script></body></html>
