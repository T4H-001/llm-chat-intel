<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Chat Intelligence</title><style>:root{color-scheme:dark;--bg:#0d0d0f;--panel:#15151a;--line:#2a2a32;--text:#e8e8ee;--muted:#9292a2;--blue:#6c8aff;--green:#5dba7e;--amber:#f5a623;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.title{font-size:24px;font-weight:700}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;text-decoration:none}.status{padding:6px 10px;border-radius:999px;background:#222;color:var(--muted);font-size:12px}.status.real{color:var(--green);background:#173023}.status.partial{color:var(--amber);background:#302410}.status.blocked{color:var(--red);background:#321919}.bar{display:flex;gap:8px;margin-bottom:16px}.input,.select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:9px}.input{flex:1}.search{border:0;background:var(--blue);color:#09090b;font-weight:700;padding:0 18px;border-radius:9px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.section h2{font-size:15px;margin:0 0 12px}.results{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:10px;padding:14px}.head{display:flex;justify-content:space-between;gap:12px}.source{font-weight:700}.date,.meta{color:var(--muted);font-size:12px}.subject{font-weight:650;margin-top:5px}.snippet{margin-top:8px;white-space:pre-wrap;color:#c8c8d0;line-height:1.55}.empty{color:var(--muted);padding:30px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.num{font-size:24px;font-weight:750}.label{color:var(--muted);font-size:12px;margin-top:4px}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><header class="top"><div><div class="title">LLM Chat Intelligence</div><div class="sub">Search the canonical indexed intelligence corpus.</div></div><div class="actions"><span id="state" class="status">READY</span><a class="btn" href="/">Runtime Monitor</a></div></header><div class="bar"><input id="q" class="input" placeholder="Search indexed intelligence…"><select id="source" class="select"><option value="">All object types</option><option>conversation</option><option>thread</option><option>document</option><option>asset</option></select><button id="go" class="search">Search</button></div><section class="stats"><div class="stat"><div id="count" class="num">—</div><div class="label">Matched</div></div><div class="stat"><div id="indexed" class="num">—</div><div class="label">Indexed objects</div></div><div class="stat"><div id="receipt" class="num">—</div><div class="label">Evidence</div></div><div class="stat"><div id="state2" class="num">PARTIAL</div><div class="label">Runtime state</div></div></section><div class="grid"><section class="section"><h2>Results</h2><div id="results" class="results"><div class="empty">Enter a search term.</div></div></section><section class="section"><h2>Evidence</h2><div id="evidence" class="empty">Live indexed-corpus evidence will appear here.</div></section></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function lit(s){return "'"+String(s).replace(/'/g,"''")+"'"}function makeSQL(q,type){let where=[];if(type)where.push(`object_type=${lit(type)}`);if(q.trim()){const t=q.trim().replace(/[%_]/g,'');where.push(`(COALESCE(title,'') ILIKE '%'||${lit(t)}||'%' OR COALESCE(search_text,'') ILIKE '%'||${lit(t)}||'%')`)}return `SELECT index_id,object_type,object_id,title,search_text,metadata,indexed_at FROM knowledge_runtime.search_index${where.length?' WHERE '+where.join(' AND '):''} ORDER BY indexed_at DESC LIMIT 100`}
function rows(x){if(Array.isArray(x))return x;if(Array.isArray(x?.result))return x.result;if(Array.isArray(x?.result?.rows))return x.result.rows;if(Array.isArray(x?.rows))return x.rows;if(Array.isArray(x?.data))return x.data;return []}function render(rs,q){$('results').replaceChildren();$('count').textContent=rs.length;if(!rs.length){$('results').append(Object.assign(document.createElement('div'),{className:'empty',textContent:'No indexed results.'}));$('evidence').textContent='Live query returned zero indexed objects.';return}for(const r of rs){const c=document.createElement('article');c.className='card';const h=document.createElement('div');h.className='head';const l=document.createElement('div');const s=document.createElement('div');s.className='source';s.textContent=r.object_type||'unknown';const t=document.createElement('div');t.className='subject';t.textContent=r.title||r.object_id||'Untitled';l.append(s,t);const d=document.createElement('div');d.className='date';d.textContent=r.indexed_at?new Date(r.indexed_at).toLocaleString('en-AU'):'';h.append(l,d);const m=document.createElement('div');m.className='meta';m.textContent=r.object_id||'';const sn=document.createElement('div');sn.className='snippet';sn.textContent=(r.search_text||'').slice(0,900);c.append(h,m,sn);$('results').append(c)}$('receipt').textContent='RETURNED';$('evidence').innerHTML=`<div class="status real">LIVE INDEX QUERY</div><p>${rs.length.toLocaleString('en-AU')} indexed objects returned.</p><p>Source: <code>knowledge_runtime.search_index</code></p><p>Query: <code>${esc(q||'all')}</code></p>`}
async function search(){const q=$('q').value,type=$('source').value;$('go').disabled=true;$('state').textContent='QUERYING';try{const r=await fetch('/api/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql:makeSQL(q,type)})});const d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);const rs=rows(d.result??d);$('state').textContent='REAL';$('state').className='status real';render(rs,q)}catch(e){$('state').textContent='BLOCKED';$('state').className='status blocked';$('results').replaceChildren(Object.assign(document.createElement('div'),{className:'empty',textContent:'Live indexed corpus unavailable: '+e.message}));$('evidence').textContent='No demo fallback is used.'}finally{$('go').disabled=false}}async function loadSummary(){try{const r=await fetch('/api/estate',{cache:'no-store'});const d=await r.json();$('indexed').textContent=d.indexed_objects??'—';$('state2').textContent=d.status||'PARTIAL'}catch(_){}}$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};loadSummary();
</script></body></html>
