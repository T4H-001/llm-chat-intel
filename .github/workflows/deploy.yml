name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_IKIr2Kcs38KGo8Zs60yNtm7Y
          vercel-project-id: prj_Jty8omrqowrzzcsFjqp2n4Jcn9PR
          working-directory: ./
          vercel-args: '--prod'
