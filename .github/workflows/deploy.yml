name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy production
        run: vercel --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_1KrnWMLLv3cBteLpk9zIJY3b
          VERCEL_PROJECT_ID: prj_Uj7xTloAW6CXTapc4nW9ftY3zxTL
