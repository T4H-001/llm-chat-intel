<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Chat Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #0a0a0f;
  --color-surface: #12121a;
  --color-surface2: #1a1a26;
  --color-border: #2a2a3d;
  --color-text: #e8e8f0;
  --color-muted: #6b6b8a;
  --color-accent: #7c6fcd;
  --color-accent2: #5b8dee;
  --color-success: #4caf7d;
  --color-warning: #f59e0b;
  --color-danger: #ef4444;
  --radius: 10px;
}
[data-theme="light"] {
  --color-bg: #f4f4f8;
  --color-surface: #ffffff;
  --color-surface2: #ebebf3;
  --color-border: #d0d0e0;
  --color-text: #1a1a2e;
  --color-muted: #6b6b8a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--color-bg); color: var(--color-text); min-height: 100vh; }

/* ── Layout ── */
.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.topbar-logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: var(--color-text); }
.topbar-logo span { color: var(--color-accent); }
.conn-indicator { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--color-muted); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-muted); transition: all 0.4s; }
#theme-toggle { background: none; border: 1px solid var(--color-border); color: var(--color-muted); border-radius: 6px; padding: 5px 8px; cursor: pointer; display: flex; align-items: center; }

.main { display: grid; grid-template-columns: 280px 1fr 320px; overflow: hidden; }

/* ── Sidebar ── */
.sidebar { background: var(--color-surface); border-right: 1px solid var(--color-border); overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; }
.sidebar-section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--color-muted); margin-bottom: 8px; }
.search-box { position: relative; }
.search-box input { width: 100%; background: var(--color-surface2); border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 12px 8px 32px; font-size: 13px; color: var(--color-text); outline: none; transition: border-color 0.2s; }
.search-box input:focus { border-color: var(--color-accent); }
.search-box svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--color-muted); }
.mic-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-muted); padding: 2px; border-radius: 4px; }
.mic-btn.active { color: var(--color-danger); }

.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; border: 1px solid var(--color-border); background: transparent; color: var(--color-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.chip:hover { border-color: var(--color-accent); color: var(--color-accent); }
.chip.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

.preset-list { display: flex; flex-direction: column; gap: 4px; }
.preset-btn { background: none; border: none; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 12px; color: var(--color-muted); cursor: pointer; transition: all 0.15s; }
.preset-btn:hover { background: var(--color-surface2); color: var(--color-text); }
.preset-btn.active { background: var(--color-surface2); color: var(--color-accent); font-weight: 500; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: var(--color-surface2); border-radius: 8px; padding: 10px 12px; }
.stat-val { font-size: 20px; font-weight: 600; color: var(--color-text); line-height: 1; }
.stat-label { font-size: 10px; color: var(--color-muted); margin-top: 3px; }

/* ── Feed ── */
.feed { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.feed-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px; border-bottom: 1px solid var(--color-border); margin-bottom: 4px; }
.feed-count { font-size: 12px; color: var(--color-muted); }
.sort-select { background: var(--color-surface2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none; cursor: pointer; }

.conv-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: all 0.15s; position: relative; }
.conv-card:hover { border-color: var(--color-accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,111,205,0.12); }
.conv-card.selected { border-color: var(--color-accent); background: var(--color-surface2); }
.conv-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.conv-title { font-size: 13px; font-weight: 500; color: var(--color-text); line-height: 1.3; flex: 1; }
.conv-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.conv-source { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; border: 1px solid; }
.source-chatgpt { color: #10a37f; border-color: #10a37f33; background: #10a37f11; }
.source-claude { color: #c07a3d; border-color: #c07a3d33; background: #c07a3d11; }
.source-gemini { color: #5b8dee; border-color: #5b8dee33; background: #5b8dee11; }
.source-other { color: var(--color-muted); border-color: var(--color-border); }
.conv-date { font-size: 11px; color: var(--color-muted); margin-left: auto; }
.conv-preview { font-size: 12px; color: var(--color-muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.conv-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--color-surface2); color: var(--color-muted); border: 1px solid var(--color-border); }
.conv-msg-count { position: absolute; top: 12px; right: 14px; font-size: 10px; color: var(--color-muted); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--color-muted); }
.empty-state svg { margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 13px; }

.loading-shimmer { background: linear-gradient(90deg, var(--color-surface) 25%, var(--color-surface2) 50%, var(--color-surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius); height: 90px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Detail Panel ── */
.detail { background: var(--color-surface); border-left: 1px solid var(--color-border); overflow-y: auto; display: flex; flex-direction: column; }
.detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--color-muted); gap: 10px; }
.detail-empty svg { opacity: 0.3; }
.detail-empty p { font-size: 13px; }
.detail-header { padding: 20px; border-bottom: 1px solid var(--color-border); }
.detail-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
.detail-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.detail-meta { display: flex; flex-direction: column; gap: 4px; }
.detail-meta-row { display: flex; gap: 6px; font-size: 12px; color: var(--color-muted); }
.detail-meta-row strong { color: var(--color-text); font-weight: 500; min-width: 70px; }
.detail-body { padding: 16px 20px; flex: 1; }
.detail-section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--color-muted); margin-bottom: 10px; }
.detail-messages { display: flex; flex-direction: column; gap: 10px; }
.msg-bubble { padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
.msg-user { background: var(--color-surface2); border-left: 3px solid var(--color-accent); }
.msg-assistant { background: transparent; border-left: 3px solid var(--color-success); }
.msg-role { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--color-muted); margin-bottom: 4px; }
.msg-text { color: var(--color-text); white-space: pre-wrap; word-break: break-word; }
.detail-copy-btn { margin: 16px 20px 20px; background: var(--color-surface2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 7px; padding: 8px 14px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; width: max-content; }
.detail-copy-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }

/* ── Chart ── */
.chart-wrap { height: 120px; position: relative; }
svg.sparkline { width: 100%; height: 100%; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">LLM Chat <span>Intel</span></div>
    <div class="conn-indicator">
      <div class="conn-dot" id="conn-dot"></div>
      <span id="conn-label">Connecting…</span>
    </div>
    <button id="theme-toggle" title="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <div class="main">

    <!-- Sidebar -->
    <aside class="sidebar">

      <!-- Search -->
      <div>
        <div class="sidebar-section-title">Search</div>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search conversations…" autocomplete="off">
          <button class="mic-btn" id="mic-btn" title="Voice search">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Source filter -->
      <div>
        <div class="sidebar-section-title">Source</div>
        <div class="filter-chips" id="source-chips"></div>
      </div>

      <!-- Topic filter -->
      <div>
        <div class="sidebar-section-title">Topic</div>
        <div class="filter-chips" id="topic-chips"></div>
      </div>

      <!-- Presets -->
      <div>
        <div class="sidebar-section-title">Quick Filters</div>
        <div class="preset-list">
          <button class="preset-btn" data-preset="all">📋 All conversations</button>
          <button class="preset-btn" data-preset="recent">🕐 Last 30 days</button>
          <button class="preset-btn" data-preset="long">📖 Long conversations</button>
          <button class="preset-btn" data-preset="technical">⚙️ Technical</button>
          <button class="preset-btn" data-preset="creative">✨ Creative</button>
        </div>
      </div>

      <!-- Stats -->
      <div>
        <div class="sidebar-section-title">Stats</div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-filtered">—</div><div class="stat-label">Filtered</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-sources">—</div><div class="stat-label">Sources</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-avg-msgs">—</div><div class="stat-label">Avg msgs</div></div>
        </div>
      </div>

      <!-- Activity chart -->
      <div>
        <div class="sidebar-section-title">Activity</div>
        <div class="chart-wrap" id="chart-wrap"></div>
      </div>

    </aside>

    <!-- Feed -->
    <main class="feed" id="feed">
      <div class="feed-header">
        <span class="feed-count" id="feed-count">Loading…</span>
        <select class="sort-select" id="sort-select">
          <option value="date_desc">Newest first</option>
          <option value="date_asc">Oldest first</option>
          <option value="msgs_desc">Most messages</option>
          <option value="title_asc">A → Z</option>
        </select>
      </div>
      <div id="cards-container"></div>
    </main>

    <!-- Detail panel -->
    <aside class="detail" id="detail-panel">
      <div class="detail-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Select a conversation</p>
      </div>
    </aside>

  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const LAMBDA_URL = 'https://zdgnab3py0.execute-api.ap-southeast-2.amazonaws.com/prod/lambda/invoke';
const LAMBDA_KEY = 'bk_gfTUR-hHSYFJz_JR8krfZLIdYSYL0sHMpAIH2X3fRvYkJva6DgmLJQ';
const SUPABASE_URL = 'https://lzfgigiyqpuuxslsygjt.supabase.co';

// ── State ─────────────────────────────────────────────────────────────────
let activeFilters = new Set();
let activeSources = new Set();
let allData = [];
let filteredData = [];
let recognition = null;
let isListening = false;

// ── Theme toggle ──────────────────────────────────────────────────────────
(function(){
  const t = document.getElementById('theme-toggle');
  const r = document.documentElement;
  let d = 'dark';
  r.setAttribute('data-theme', d);
  if (t) t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    t.innerHTML = d === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  });
})();

// ── Connection test ───────────────────────────────────────────────────────
async function testConnection() {
  const dot = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  try {
    const sql = 'SELECT COUNT(*) as total FROM gpt_conversations';
    const res = await callLambda(sql);
    if (res && res.length > 0) {
      dot.style.background = 'var(--color-success)';
      dot.style.boxShadow = '0 0 6px var(--color-success)';
      label.textContent = `Connected — ${res[0].total} chats`;
      return true;
    }
  } catch(e) {
    // fallback to demo mode
  }
  dot.style.background = 'var(--color-warning)';
  dot.style.boxShadow = '0 0 6px var(--color-warning)';
  label.textContent = 'Demo mode (no live connection)';
  return false;
}

// ── Lambda caller ─────────────────────────────────────────────────────────
async function callLambda(sql) {
  const resp = await fetch(LAMBDA_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': LAMBDA_KEY },
    body: JSON.stringify({ fn: 'troy-sql-executor', sql })
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (Array.isArray(data)) return data;
  if (data.body) {
    const b = typeof data.body === 'string' ? JSON.parse(data.body) : data.body;
    if (Array.isArray(b)) return b;
    if (b.rows) return b.rows;
    if (b.data) return b.data;
  }
  if (data.rows) return data.rows;
  if (data.data) return data.data;
  return [];
}

// ── NLP query parser ──────────────────────────────────────────────────────
function parseQuery(text) {
  const t = text.toLowerCase();
  const intent = { filters: {}, search: '', preset: null };
  if (t.includes('last week') || t.includes('7 days')) intent.filters.days = 7;
  else if (t.includes('last month') || t.includes('30 days')) intent.filters.days = 30;
  else if (t.includes('yesterday')) intent.filters.days = 1;
  if (t.includes('chatgpt') || t.includes('gpt')) intent.filters.source = 'ChatGPT';
  else if (t.includes('claude')) intent.filters.source = 'Claude';
  else if (t.includes('gemini')) intent.filters.source = 'Gemini';
  if (t.includes('long') || t.includes('detailed')) intent.filters.minMsgs = 10;
  if (t.includes('technical') || t.includes('code') || t.includes('programming')) intent.filters.topic = 'technical';
  if (t.includes('creative') || t.includes('writing') || t.includes('story')) intent.filters.topic = 'creative';
  const searchTerms = text.replace(/last week|last month|yesterday|chatgpt|claude|gemini|long|technical|creative|show me|find|search/gi, '').trim();
  if (searchTerms.length > 2) intent.search = searchTerms;
  return intent;
}

// ── Build SQL from intent ─────────────────────────────────────────────────
function buildSQL(intent) {
  let where = [];
  if (intent.filters.days) {
    where.push(`created_at >= NOW() - INTERVAL '${intent.filters.days} days'`);
  }
  if (intent.filters.source) {
    where.push(`source ILIKE '%${intent.filters.source}%'`);
  }
  if (intent.filters.minMsgs) {
    where.push(`message_count >= ${intent.filters.minMsgs}`);
  }
  if (intent.filters.topic === 'technical') {
    where.push(`(title ILIKE '%code%' OR title ILIKE '%api%' OR title ILIKE '%sql%' OR title ILIKE '%python%' OR title ILIKE '%javascript%' OR title ILIKE '%debug%' OR title ILIKE '%error%' OR title ILIKE '%function%')`);
  }
  if (intent.filters.topic === 'creative') {
    where.push(`(title ILIKE '%write%' OR title ILIKE '%story%' OR title ILIKE '%creat%' OR title ILIKE '%draft%' OR title ILIKE '%essay%')`);
  }
  if (intent.search) {
    const s = intent.search.replace(/'/g, "''");
    where.push(`(title ILIKE '%${s}%' OR content ILIKE '%${s}%')`);
  }
  // active source/topic filters from UI chips
  if (activeSources.size > 0) {
    const srcs = [...activeSources].map(s => `source ILIKE '%${s}%'`).join(' OR ');
    where.push(`(${srcs})`);
  }
  if (activeFilters.size > 0) {
    const topics = [...activeFilters].map(f => {
      const kw = f.toLowerCase();
      return `(title ILIKE '%${kw}%' OR content ILIKE '%${kw}%')`;
    }).join(' OR ');
    where.push(`(${topics})`);
  }
  const clause = where.length ? 'WHERE ' + where.join(' AND ') : '';
  return `SELECT id, title, source, created_at, message_count, tags, preview FROM gpt_conversations ${clause} ORDER BY created_at DESC LIMIT 200`;
}

// ── Sort data ─────────────────────────────────────────────────────────────
function sortData(data, mode) {
  const d = [...data];
  switch(mode) {
    case 'date_asc':   return d.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    case 'msgs_desc':  return d.sort((a,b) => (b.message_count||0) - (a.message_count||0));
    case 'title_asc':  return d.sort((a,b) => (a.title||'').localeCompare(b.title||''));
    default:           return d.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  }
}

// ── Render cards ──────────────────────────────────────────────────────────
function renderCards(data) {
  const container = document.getElementById('cards-container');
  const countEl = document.getElementById('feed-count');
  document.getElementById('stat-filtered').textContent = data.length;
  countEl.textContent = `${data.length} conversation${data.length !== 1 ? 's' : ''}`;

  if (!data.length) {
    container.innerHTML = `<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No conversations match your filters.</p></div>`;
    return;
  }

  container.innerHTML = data.map(c => {
    const srcClass = c.source ? 'source-' + c.source.toLowerCase().replace(/[^a-z]/g,'') : 'source-other';
    const date = c.created_at ? new Date(c.created_at).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '';
    const tags = (c.tags || []).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('');
    const preview = (c.preview || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="conv-card" data-id="${c.id}" onclick="showDetail('${c.id}')">
      ${c.message_count ? `<div class="conv-msg-count">${c.message_count} msgs</div>` : ''}
      <div class="conv-card-top">
        <div class="conv-title">${(c.title || 'Untitled').replace(/</g,'&lt;')}</div>
      </div>
      <div class="conv-preview">${preview}</div>
      <div class="conv-meta">
        <span class="conv-source ${srcClass}">${c.source || 'Unknown'}</span>
        <span class="conv-date">${date}</span>
      </div>
      ${tags ? `<div class="conv-tags">${tags}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Show detail ───────────────────────────────────────────────────────────
async function showDetail(id) {
  document.querySelectorAll('.conv-card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) card.classList.add('selected');

  const panel = document.getElementById('detail-panel');
  panel.innerHTML = `<div class="detail-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><p>Loading…</p></div>`;

  try {
    const row = allData.find(r => r.id == id);
    if (!row) throw new Error('Not found');

    // Try to fetch full messages
    let messages = [];
    try {
      const msgSQL = `SELECT role, content FROM gpt_messages WHERE conversation_id = ${id} ORDER BY position ASC LIMIT 40`;
      messages = await callLambda(msgSQL);
    } catch(e) { /* messages table may not exist */ }

    const date = row.created_at ? new Date(row.created_at).toLocaleString('en-AU') : 'Unknown';
    const srcClass = row.source ? 'source-' + row.source.toLowerCase().replace(/[^a-z]/g,'') : 'source-other';
    const tags = (row.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

    const msgsHtml = messages.length
      ? messages.map(m => `<div class="msg-bubble msg-${m.role}">
          <div class="msg-role">${m.role}</div>
          <div class="msg-text">${(m.content||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').substring(0,600)}${(m.content||'').length > 600 ? '…' : ''}</div>
        </div>`).join('')
      : row.preview
        ? `<div class="msg-bubble msg-user"><div class="msg-role">preview</div><div class="msg-text">${(row.preview||'').replace(/</g,'&lt;')}</div></div>`
        : `<p style="color:var(--color-muted);font-size:12px">No message content available.</p>`;

    panel.innerHTML = `
      <div class="detail-header">
        <div class="detail-title">${(row.title || 'Untitled').replace(/</g,'&lt;')}</div>
        <div class="detail-badges">
          <span class="conv-source ${srcClass}">${row.source || 'Unknown'}</span>
          ${tags}
        </div>
        <div class="detail-meta">
          <div class="detail-meta-row"><strong>Date</strong>${date}</div>
          ${row.message_count ? `<div class="detail-meta-row"><strong>Messages</strong>${row.message_count}</div>` : ''}
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-section-title">Messages</div>
        <div class="detail-messages">${msgsHtml}</div>
      </div>
      <button class="detail-copy-btn" onclick="copyDetail()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy title
      </button>
    `;
    panel._currentRow = row;
  } catch(e) {
    panel.innerHTML = `<div class="detail-empty"><p>Failed to load: ${e.message}</p></div>`;
  }
}

function copyDetail() {
  const panel = document.getElementById('detail-panel');
  const row = panel._currentRow;
  if (row) navigator.clipboard.writeText(row.title || '').catch(()=>{});
}

// ── Activity sparkline ────────────────────────────────────────────────────
function renderSparkline(data) {
  const wrap = document.getElementById('chart-wrap');
  if (!data.length) { wrap.innerHTML = ''; return; }
  // bucket by month
  const buckets = {};
  data.forEach(c => {
    const k = c.created_at ? c.created_at.substring(0,7) : 'unknown';
    buckets[k] = (buckets[k] || 0) + 1;
  });
  const keys = Object.keys(buckets).sort();
  const vals = keys.map(k => buckets[k]);
  const max = Math.max(...vals, 1);
  const W = 256, H = 100, pad = 8;
  const pts = vals.map((v,i) => {
    const x = pad + (i / Math.max(vals.length-1,1)) * (W - pad*2);
    const y = H - pad - (v / max) * (H - pad*2);
    return `${x},${y}`;
  });
  const area = `M${pts[0]} ` + pts.slice(1).map(p=>`L${p}`).join(' ') + ` L${pts[pts.length-1].split(',')[0]},${H-pad} L${pad},${H-pad} Z`;
  wrap.innerHTML = `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

// ── Update stats ──────────────────────────────────────────────────────────
function updateStats(data) {
  document.getElementById('stat-total').textContent = allData.length;
  document.getElementById('stat-filtered').textContent = data.length;
  const sources = new Set(data.map(c => c.source).filter(Boolean));
  document.getElementById('stat-sources').textContent = sources.size;
  const avgMsgs = data.length ? Math.round(data.reduce((s,c) => s + (c.message_count||0), 0) / data.length) : 0;
  document.getElementById('stat-avg-msgs').textContent = avgMsgs;
}

// ── Build filter chips ────────────────────────────────────────────────────
function buildChips(data) {
  const sources = [...new Set(data.map(c => c.source).filter(Boolean))];
  const sourceContainer = document.getElementById('source-chips');
  sourceContainer.innerHTML = sources.map(s =>
    `<button class="chip ${activeSources.has(s) ? 'active' : ''}" data-source="${s}" onclick="toggleSource('${s}')">${s}</button>`
  ).join('');

  const allTags = data.flatMap(c => c.tags || []);
  const tagCounts = {};
  allTags.forEach(t => tagCounts[t] = (tagCounts[t]||0) + 1);
  const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([t])=>t);
  const topicContainer = document.getElementById('topic-chips');
  topicContainer.innerHTML = topTags.map(t =>
    `<button class="chip ${activeFilters.has(t) ? 'active' : ''}" onclick="toggleFilter('${t}')">${t}</button>`
  ).join('');
}

function toggleSource(src) {
  if (activeSources.has(src)) activeSources.delete(src);
  else activeSources.add(src);
  applyFilters();
}
function toggleFilter(f) {
  if (activeFilters.has(f)) activeFilters.delete(f);
  else activeFilters.add(f);
  applyFilters();
}

// ── Apply filters locally ─────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('search-input').value.trim();
  const sort = document.getElementById('sort-select').value;
  let data = [...allData];

  if (activeSources.size > 0) {
    data = data.filter(c => activeSources.has(c.source));
  }
  if (activeFilters.size > 0) {
    data = data.filter(c => {
      const tags = c.tags || [];
      const title = (c.title||'').toLowerCase();
      return [...activeFilters].some(f => tags.includes(f) || title.includes(f.toLowerCase()));
    });
  }
  if (q) {
    const ql = q.toLowerCase();
    data = data.filter(c =>
      (c.title||'').toLowerCase().includes(ql) ||
      (c.preview||'').toLowerCase().includes(ql) ||
      (c.tags||[]).some(t => t.toLowerCase().includes(ql))
    );
  }

  filteredData = sortData(data, sort);
  renderCards(filteredData);
  updateStats(filteredData);
  buildChips(allData);
  renderSparkline(filteredData);
}

// ── Load all data ─────────────────────────────────────────────────────────
async function loadData() {
  const container = document.getElementById('cards-container');
  container.innerHTML = [1,2,3,4,5].map(()=>'<div class="loading-shimmer" style="margin-bottom:10px"></div>').join('');

  try {
    const sql = `SELECT id, title, source, created_at, message_count, tags, preview FROM gpt_conversations ORDER BY created_at DESC LIMIT 500`;
    const data = await callLambda(sql);
    allData = data || [];
    filteredData = allData;
    applyFilters();
    renderSparkline(allData);
  } catch(e) {
    // Load demo data if DB not reachable
    allData = getDemoData();
    filteredData = allData;
    applyFilters();
    renderSparkline(allData);
  }
}

// ── Preset buttons ────────────────────────────────────────────────────────
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const preset = btn.dataset.preset;
    activeFilters.clear();
    activeSources.clear();
    document.getElementById('search-input').value = '';
    if (preset === 'recent') {
      const cutoff = new Date(Date.now() - 30*24*60*60*1000);
      filteredData = allData.filter(c => new Date(c.created_at) > cutoff);
    } else if (preset === 'long') {
      filteredData = allData.filter(c => (c.message_count||0) >= 8);
    } else if (preset === 'technical') {
      const kw = ['code','api','sql','python','javascript','debug','error','function','react','nodejs','database'];
      filteredData = allData.filter(c => kw.some(k => (c.title||'').toLowerCase().includes(k)));
    } else if (preset === 'creative') {
      const kw = ['write','story','creat','draft','essay','poem','novel','blog'];
      filteredData = allData.filter(c => kw.some(k => (c.title||'').toLowerCase().includes(k)));
    } else {
      filteredData = [...allData];
    }
    filteredData = sortData(filteredData, document.getElementById('sort-select').value);
    renderCards(filteredData);
    updateStats(filteredData);
    buildChips(allData);
    renderSparkline(filteredData);
  });
});

// ── Search input ──────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 300);
});

// ── Sort ──────────────────────────────────────────────────────────────────
document.getElementById('sort-select').addEventListener('change', applyFilters);

// ── Voice search ──────────────────────────────────────────────────────────
const micBtn = document.getElementById('mic-btn');
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = e => {
    document.getElementById('search-input').value = e.results[0][0].transcript;
    applyFilters();
  };
  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('active');
  };
  micBtn.addEventListener('click', () => {
    if (isListening) { recognition.stop(); }
    else { recognition.start(); isListening = true; micBtn.classList.add('active'); }
  });
} else {
  micBtn.style.display = 'none';
}

// ── Init ──────────────────────────────────────────────────────────────────
testConnection();
loadData();
</script>
